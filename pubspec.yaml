name: roda
description: A Capoeira class and Roda tracker app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Routing
  go_router: ^13.2.0
  
  # Supabase Auth (replaces Firebase)
  # firebase_core: ^4.0.0  # Removed - using Supabase
  # firebase_auth: ^6.0.1   # Removed - using Supabase Auth
  # google_sign_in: ^6.2.2  # Removed - Supabase handles OAuth
  # sign_in_with_apple: ^6.1.4  # Removed - Supabase handles OAuth
  
  # Maps
  google_maps_flutter: ^2.5.3
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  flutter_typeahead: ^4.8.0
  google_places_sdk: ^1.0.0
  http: ^1.2.0
  
  # UI & Utilities
  intl: ^0.19.0
  equatable: ^2.0.5
  flutter_svg: ^2.0.10
  
  # Payment Links
  url_launcher: ^6.2.5
  
  # Image handling
  image_picker: ^1.0.7
  crypto: ^3.0.3
  path: ^1.8.3
  supabase_flutter: ^2.9.1
  app_links: ^6.3.2

  cached_network_image: any
  uuid: ^4.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  
  # assets:
  #   - assets/images/
  #   - assets/icons/